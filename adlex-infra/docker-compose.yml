version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adlex-postgres
    environment:
      POSTGRES_DB: adlex
      POSTGRES_USER: adlex
      POSTGRES_PASSWORD: adlex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: adlex-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

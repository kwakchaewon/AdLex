spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        dialect: com.adlex.config.TestH2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

adlex:
  jwt:
    secret: test-secret-key-for-unit-testing-minimum-256-bits-long-enough-chars

spring:
  application:
    name: adlex-api
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/adlex
    username: adlex
    password: adlex
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method

adlex:
  jwt:
    secret: ${ADLEX_JWT_SECRET:adlex-local-dev-secret-key-minimum-256-bits-long-padding}
  rag:
    law-chunks-top-k: 3       # 유사 법령 조문 검색 수
    precedents-top-k: 2       # 유사 판례 검색 수
    cache-ttl-minutes: 60     # 임베딩 캐시 TTL (분)
  crawler:
    enabled: true
    law-api-key: ${LAW_API_KEY:}  # 국가법령정보센터 Open API 키
    cron: "0 0 2 * * *"           # 매일 새벽 2시 실행
    target-laws:
      - "표시·광고의 공정화에 관한 법률"
      - "전자상거래 등에서의 소비자보호에 관한 법률"
      - "방문판매 등에 관한 법률"
      - "식품 등의 표시·광고에 관한 법률"
      - "화장품법"
      - "의료기기법"
      - "의료법"
      - "건강기능식품에 관한 법률"

portone:
  api-key: ${PORTONE_API_KEY:}
  api-secret: ${PORTONE_API_SECRET:}

openai:
  api-key: ${OPENAI_API_KEY:}
  embedding:
    model: text-embedding-3-small

claude:
  api-key: ${CLAUDE_API_KEY:}
  model: claude-opus-4-6
  max-tokens: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

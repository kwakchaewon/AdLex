spring:
  application:
    name: adlex-api
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/adlex
    username: adlex
    password: adlex
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method

adlex:
  jwt:
    secret: ${ADLEX_JWT_SECRET:adlex-local-dev-secret-key-minimum-256-bits-long-padding}
  rag:
    law-chunks-top-k: 3       # 유사 법령 조문 검색 수
    precedents-top-k: 2       # 유사 판례 검색 수
    cache-ttl-minutes: 60     # 임베딩 캐시 TTL (분)

portone:
  api-key: ${PORTONE_API_KEY:}
  api-secret: ${PORTONE_API_SECRET:}

openai:
  api-key: ${OPENAI_API_KEY:}
  embedding:
    model: text-embedding-3-small

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

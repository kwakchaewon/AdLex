[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "adlex"
version = "0.1.0"
description = "AdLex Python SDK — 마케팅·광고 메시지 법규 준수 검사 API"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
